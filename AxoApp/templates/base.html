<!DOCTYPE html>
{% load static %}
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Handlee&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nanum+Pen+Script&family=Press+Start+2P&family=Shizuru&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="{% static 'pics/heart.png' %}">

    <!-- HIER IST IHR NEUES AUSGELAGERTES CSS -->
    <link rel="stylesheet" href="{% static 'code/css/style1.css' %}">
</head>

<body>
    <header class="site-header">
        <nav class="container site-header-inner d-flex align-items-center justify-content-between" aria-label="Hauptnavigation">
            <a class="site-logo" href="{% url 'home' %}">
                <img id="meinBild" 
                     src="{% static 'pics/axo1.png' %}" 
                     data-alt-src="{% static 'pics/axo2.png' %}" 
                     class="klickbar" 
                     alt="Wechselbild">
                <span>Axolovel</span>
            </a>
            
            <details class="site-menu">
                <summary class="menu-toggle" aria-label="Menü öffnen">
                    <span></span><span></span><span></span>
                </summary>
                <div class="menu-panel">
                    <a href="{% url 'app_settings' %}">Einstellungen</a>
                    <a href="{% url 'account' %}">Profil</a>
                    <a href="{% url 'themes' %}">Axolotl Themes</a>
                </div>
            </details>
        </nav>
    </header>

    {% block content %}
    {% endblock %}

    <!-- Globales JavaScript am Ende geladen -->
    <script src="{% static 'code/js/main.js' %}" defer></script> <!-- defer bedeutet, dass die Fkt im HG runtergel wird, aber erst ausgeführt wird, wenn HTML ganz gebaut ist -->
</body>
</html>

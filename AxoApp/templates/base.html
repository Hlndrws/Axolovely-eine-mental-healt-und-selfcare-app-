<!DOCTYPE html>
{% load static %}
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

 
       <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Handlee&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nanum+Pen+Script&family=Press+Start+2P&family=Shizuru&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'pics/heart.png' %}">
    <style>
        :root {
            --axolovel-pink: #f5c4d5;
            --axolovel-pink-hover: #edafc5;
            --axolovel-card-pink: #f9d5e1;
            --axolovel-lavender: #cdb7e6;
            --axolovel-ink: #3f2933;
            --font-chewy: "Chewy", cursive;
            --font-handlee: "Handlee", cursive;
            --font-montserrat: "Montserrat", sans-serif;
            --font-nanum-pen: "Nanum Pen Script", cursive;
            --font-press-start: "Press Start 2P", cursive;
            --font-shizuru: "Shizuru", cursive;
            --bs-body-font-family: var(--font-handlee);
        }

        body {
            font-family: var(--font-handlee);
            color: var(--axolovel-ink);
        }

        h1,
        h2,
        h3,
        .site-logo {
            font-family: var(--font-handlee);
            font-weight: 400;
        }

        .lead {
            font-family: var(--font-handlee);
            font-size: 1.35rem;
        }

        .btn-primary {
            --bs-btn-color: var(--axolovel-ink);
            --bs-btn-bg: var(--axolovel-pink);
            --bs-btn-border-color: var(--axolovel-pink);
            --bs-btn-hover-color: var(--axolovel-ink);
            --bs-btn-hover-bg: var(--axolovel-pink-hover);
            --bs-btn-hover-border-color: var(--axolovel-pink-hover);
            --bs-btn-active-color: var(--axolovel-ink);
            --bs-btn-active-bg: var(--axolovel-pink-hover);
            --bs-btn-active-border-color: var(--axolovel-pink-hover);
            --bs-btn-focus-shadow-rgb: 237, 175, 197;
        }

        .btn-begin {
            padding: 0.65rem 1.5rem;
            font-family: var(--font-handlee);
            font-size: 1.3rem;
        }

        input,
        select,
        textarea,
        button {
            font-family: var(--font-handlee);
        }

        .site-header {
            position: relative;
            z-index: 10;
            background: var(--axolovel-pink);
            color: var(--axolovel-ink);
        }

        .site-header-inner {
            min-height: 88px;
        }

        .site-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            color: inherit;
            text-decoration: none;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .site-logo img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        .site-menu {
            position: relative;
        }

        .menu-toggle {
            display: grid;
            place-content: center;
            gap: 5px;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(63, 41, 51, 0.28);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            list-style: none;
        }

        .menu-toggle::-webkit-details-marker {
            display: none;
        }

        .menu-toggle span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--axolovel-ink);
        }

        .menu-toggle:hover,
        .site-menu[open] .menu-toggle {
            background: var(--axolovel-pink-hover);
        }

        .menu-panel {
            position: absolute;
            top: calc(100% + 0.6rem);
            right: 0;
            min-width: 220px;
            padding: 0.45rem;
            border: 1px solid #ead4dc;
            border-radius: 6px;
            background: #fff;
            box-shadow: 0 10px 28px rgba(63, 41, 51, 0.14);
        }

        .menu-panel a {
            display: block;
            padding: 0.7rem 0.8rem;
            border-radius: 4px;
            color: var(--axolovel-ink);
            text-decoration: none;
        }

        .menu-panel a:hover,
        .menu-panel a:focus-visible {
            background: var(--axolovel-pink);
        }

        .message-close {
            flex: 0 0 28px;
            width: 28px;
            height: 28px;
            margin: -0.25rem -0.25rem 0 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: inherit;
            font-size: 1.25rem;
            line-height: 1;
        }

        .message-close:hover,
        .message-close:focus-visible {
            background: rgba(63, 41, 51, 0.1);
        }

        .back-arrow {
            display: inline-grid;
            width: 46px;
            height: 46px;
            place-items: center;
            border: 1px solid #e5c8d4;
            border-radius: 50%;
            background: #fff;
            color: var(--axolovel-ink);
            font-size: 1.55rem;
            line-height: 1;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(63, 41, 51, 0.1);
            transition: background-color 140ms ease, transform 140ms ease;
        }

        .back-arrow:hover,
        .back-arrow:focus-visible {
            transform: translateX(-2px);
            background: var(--axolovel-pink);
            color: var(--axolovel-ink);
        }

        .back-arrow-floating {
            position: fixed;
            z-index: 20;
            top: 1rem;
            left: 1rem;
        }
    </style>

</head>

<body>
    <header class="site-header">
        <nav class="container site-header-inner d-flex align-items-center justify-content-between" aria-label="Hauptnavigation">
            <a class="site-logo" href="{% url 'home' %}">
                <img src="{% static 'pics/heart.png' %}" alt="">
                <span>Axolovel</span>
            </a>

            <details class="site-menu">
                <summary class="menu-toggle" aria-label="Menü öffnen">
                    <span></span><span></span><span></span>
                </summary>
                <div class="menu-panel">
                    <a href="{% url 'app_settings' %}">Einstellungen</a>
                    <a href="{% url 'account' %}">Profil</a>
                    <a href="{% url 'themes' %}">Axolotl Themes</a>
                </div>
            </details>
        </nav>
    </header>

    {% block content %}
    {% endblock %}

    <script>
        document.addEventListener("click", (event) => {
            const closeButton = event.target.closest("[data-dismiss-message]");
            if (closeButton) {
                closeButton.closest(".alert").remove();
            }
        });
    </script>

</body>

</html>
